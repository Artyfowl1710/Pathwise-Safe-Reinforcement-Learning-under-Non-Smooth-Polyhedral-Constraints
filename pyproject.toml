[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pifsrl"
version = "0.1.0"
description = "Physics-Informed Federated Safe RL for V2G Coordination"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Mihir Harshad Khatri"}
]
keywords = ["reinforcement-learning", "safe-rl", "v2g", "smart-grid", "power-flow", "admm"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "scipy>=1.10",
    "cvxpy>=1.4",
    "osqp>=0.6",
    "matplotlib>=3.7",
    "pandas>=2.0"
]

[project.optional-dependencies]
test = [
    "pytest>=7.4"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pifsrl*"]
